name: Déploiement GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run collide
      - run: npm run build
      # Le test de fumée (build chargé dans Chromium) ne tourne plus ici : sans GPU, le
      # rendu logiciel de la machine est trop lent pour lui. À lancer à la main avant de
      # pousser : npm run build && npm run smoke
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Déploie uniquement depuis la branche par défaut du dépôt.
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
