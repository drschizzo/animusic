<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animusic — prototype</title>
  </head>
  <body>
    <div id="stage"></div>

    <aside id="panel">
      <h1>
        Animusic <span>proto</span>
        <button id="collapse" class="icon" title="Replier le panneau" aria-expanded="true">▾</button>
      </h1>
      <div id="panelBody">
      <p class="hint">Glisse un ou plusieurs fichiers <b>.mid</b> (playlist) ou un enregistrement (<b>.mp3</b>, .wav…) sur la page, ou :</p>
      <div class="row">
        <label class="btn">
          Ouvrir…
          <input id="file" type="file" accept=".mid,.midi,audio/*,.mp3,.wav,.ogg,.flac,.m4a" multiple hidden />
        </label>
        <button id="demo" class="btn">Démo</button>
      </div>

      <details id="playlist" open hidden>
        <summary id="playlistSummary">Playlist</summary>
        <ol id="playlistItems"></ol>
        <div class="row">
          <button id="prevSong" class="btn" title="Morceau précédent">⏮</button>
          <button id="nextSong" class="btn" title="Morceau suivant">⏭</button>
          <label class="btn" title="Ajouter des fichiers MIDI à la playlist">
            Ajouter…
            <input id="addFiles" type="file" accept=".mid,.midi" multiple hidden />
          </label>
          <button id="clearPlaylist" class="btn" title="Vider la playlist">Vider</button>
        </div>
      </details>

      <div id="song" hidden>
        <h2 id="songName"></h2>
        <details id="trackBox">
          <summary id="trackSummary">Pistes et instruments</summary>
          <ul id="tracks"></ul>
        </details>
        <div class="row">
          <button id="play" class="btn primary">▶ Lecture</button>
          <button id="restart" class="btn">⏮ Début</button>
        </div>
        <div class="row">
          <label class="toggle" title="Reprend le morceau au début une fois terminé"><input id="loop" type="checkbox" /> Lecture en boucle</label>
        </div>
        <div class="row">
          <button id="record" class="btn" title="Rejoue le morceau depuis le début et l'enregistre en vidéo">⏺ Vidéo</button>
          <button id="exportGltf" class="btn" title="Animation complète au format glTF, à importer dans Blender">⇩ Blender</button>
        </div>
        <p id="exportStatus" class="hint" hidden></p>
        <div class="row">
          <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="Position dans le morceau" />
        </div>
        <div class="row">
          <span id="time">0:00</span>
          <label class="toggle"
            >Caméra
            <select id="camMode">
              <option value="director" selected>Réalisateur</option>
              <option value="orbit">Orbite</option>
              <option value="free">Libre</option>
            </select></label
          >
        </div>
        <div class="row">
          <label for="offset" class="muted">Retard image</label>
          <input id="offset" type="range" min="-300" max="800" step="10" value="0" />
          <span id="offsetVal" class="muted">0 ms</span>
        </div>
        <div class="row">
          <label class="toggle"
            >Qualité
            <select id="quality">
              <option value="auto" selected>Auto</option>
              <option value="high">Haute</option>
              <option value="medium">Moyenne</option>
              <option value="low">Basse</option>
            </select></label
          >
          <span id="fps" class="muted"></span>
        </div>
        <div class="row">
          <label class="toggle" title="La lumière des instruments éclaire les surfaces voisines (qualité haute uniquement)"
            ><input id="gi" type="checkbox" checked /> Lumière indirecte (SSGI)</label
          >
        </div>
        <div class="row" id="listenRow" hidden>
          <label class="toggle"
            >Écouter
            <select id="listen">
              <option value="original" selected>l’enregistrement original</option>
              <option value="transcription">la transcription</option>
            </select></label
          >
        </div>
        <div class="row">
          <label class="toggle"><input id="samples" type="checkbox" checked /> Sons réalistes (SoundFont MuseScore General)</label>
        </div>
        <p id="sound" class="hint"></p>
        <p id="latency" class="hint"></p>
      </div>
      <p id="error" class="error" hidden></p>
      </div>
    </aside>

    <div id="drop" hidden>Dépose ton fichier MIDI ou audio</div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
